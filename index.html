<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Senior Citizen Schemes — Data Collection &amp; Analysis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --navy-900:#0f172a;
    --navy-800:#1e293b;
    --navy-700:#2c3e56;
    --paper:#faf8f4;
    --paper-dim:#f0ede5;
    --ink:#1c1e21;
    --ink-dim:#5b6270;
    --line:#e2ddd1;
    --saffron:#e8a33d;
    --saffron-dark:#c9821f;
    --blue:#2563eb;
    --blue-bg:#eaf1ff;
    --green:#15803d;
    --green-bg:#e8f7ee;
    --orange:#c2660c;
    --orange-bg:#fdf1e2;
    --red:#b91c1c;
    --red-bg:#fdecec;
    --gray:#57606f;
    --gray-bg:#eceef1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;}
  #root{min-height:100vh;display:flex;flex-direction:column;}

  /* Header */
  .app-header{
    background:linear-gradient(135deg,var(--navy-900),var(--navy-800));
    color:#fff;
    padding:22px 24px;
    box-shadow:0 2px 14px rgba(15,23,42,.25);
    position:sticky;top:0;z-index:20;
  }
  .app-header-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-badge{
    width:40px;height:40px;border-radius:8px;background:var(--saffron);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy-900);
    font-size:15px;letter-spacing:.5px;flex-shrink:0;
  }
  .brand-title{font-size:16px;font-weight:700;line-height:1.25;}
  .brand-sub{font-size:11.5px;color:#b9c2d6;letter-spacing:.4px;text-transform:uppercase;margin-top:2px;}
  .nav-tabs{display:flex;gap:4px;flex-wrap:wrap;}
  .nav-tab{
    background:transparent;border:1px solid rgba(255,255,255,.16);color:#d7dce6;
    padding:8px 13px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;
    transition:all .15s ease;white-space:nowrap;
  }
  .nav-tab:hover{background:rgba(255,255,255,.08);color:#fff;}
  .nav-tab.active{background:var(--saffron);border-color:var(--saffron);color:var(--navy-900);}

  main{flex:1;max-width:1180px;width:100%;margin:0 auto;padding:28px 24px 60px;}

  /* Home */
  .hero{text-align:center;padding:38px 10px 34px;}
  .hero-eyebrow{
    display:inline-block;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--saffron-dark);font-weight:700;margin-bottom:10px;
  }
  .hero h1{font-size:clamp(24px,4vw,36px);margin:0 0 12px;line-height:1.2;color:var(--navy-900);}
  .hero p{color:var(--ink-dim);max-width:640px;margin:0 auto;font-size:15px;line-height:1.6;}

  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:32px;}
  .home-card{
    border-radius:14px;padding:22px;cursor:pointer;border:1px solid var(--line);
    background:#fff;transition:transform .15s ease,box-shadow .15s ease;text-align:left;
    display:flex;flex-direction:column;gap:8px;
  }
  .home-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(15,23,42,.12);}
  .home-card .icon-tab{
    width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;color:#fff;
  }
  .home-card h3{margin:6px 0 2px;font-size:16px;color:var(--navy-900);}
  .home-card p{margin:0;font-size:13px;color:var(--ink-dim);line-height:1.5;}
  .tab-blue{background:var(--blue);}
  .tab-purple{background:#7c3aed;}
  .tab-orange{background:var(--orange);}
  .tab-red{background:var(--red);}
  .tab-navy{background:var(--navy-800);}

  .home-stats{display:flex;gap:14px;justify-content:center;margin-top:30px;flex-wrap:wrap;}
  .home-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 22px;text-align:center;min-width:120px;}
  .home-stat .num{font-size:22px;font-weight:800;color:var(--navy-900);}
  .home-stat .lbl{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

  /* Cards / panels */
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:20px;}
  .panel-title{font-size:17px;font-weight:700;color:var(--navy-900);margin:0 0 4px;}
  .panel-sub{font-size:12.5px;color:var(--ink-dim);margin:0 0 18px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--navy-800);margin-bottom:5px;}
  .field input,.field select{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);
    font-size:14px;background:var(--paper-dim);color:var(--ink);
  }
  .field input:focus,.field select:focus{outline:2px solid var(--saffron);outline-offset:1px;background:#fff;}
  .field .err{color:var(--red);font-size:11.5px;margin-top:4px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:560px){.field-row{grid-template-columns:1fr;}}

  .btn{
    border:none;border-radius:8px;padding:11px 18px;font-size:13.5px;font-weight:700;
    cursor:pointer;transition:filter .15s ease,transform .1s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--navy-900);color:#fff;}
  .btn-primary:hover{filter:brightness(1.2);}
  .btn-saffron{background:var(--saffron);color:var(--navy-900);}
  .btn-saffron:hover{filter:brightness(1.06);}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--navy-800);}
  .btn-outline:hover{background:var(--paper-dim);}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-danger:hover{filter:brightness(1.1);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:6px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* Scheme ledger rows (step 2 form) */
  .scheme-row{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--paper-dim);}
  .scheme-row-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;}
  .scheme-idx{
    width:28px;height:28px;border-radius:50%;background:var(--navy-900);color:var(--saffron);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;
  }
  .scheme-name{font-weight:700;font-size:14px;color:var(--navy-900);}
  .scheme-note{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
  .option-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
  .opt-btn{
    border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;
    font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;color:var(--ink-dim);
    transition:all .12s ease;
  }
  .opt-btn:hover{border-color:var(--saffron);}
  .opt-btn.sel-enrolled_through_awareness.selected{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);}
  .opt-btn.sel-already_enrolled.selected{background:var(--green-bg);border-color:var(--green);color:var(--green);}
  .opt-btn.sel-interested_through_awareness.selected{background:var(--orange-bg);border-color:var(--orange);color:var(--orange);}
  .opt-btn.sel-not_interested.selected{background:var(--red-bg);border-color:var(--red);color:var(--red);}
  .opt-btn.sel-not_applicable.selected{background:var(--gray-bg);border-color:var(--gray);color:var(--gray);}

  .steps{display:flex;gap:8px;align-items:center;margin-bottom:22px;}
  .step-pill{
    padding:6px 13px;border-radius:20px;font-size:12px;font-weight:700;background:var(--paper-dim);
    color:var(--ink-dim);border:1px solid var(--line);
  }
  .step-pill.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}
  .step-arrow{color:var(--ink-dim);font-size:12px;}

  /* Summary cards */
  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
  .summary-card{border-radius:12px;padding:16px;border:1px solid var(--line);background:#fff;}
  .summary-card .num{font-size:24px;font-weight:800;}
  .summary-card .lbl{font-size:11.5px;color:var(--ink-dim);margin-top:3px;font-weight:600;}
  .sc-total .num{color:var(--navy-900);}
  .sc-enrolled_through_awareness .num{color:var(--blue);}
  .sc-already_enrolled .num{color:var(--green);}
  .sc-interested_through_awareness .num{color:var(--orange);}
  .sc-not_interested .num{color:var(--red);}
  .sc-not_applicable .num{color:var(--gray);}

  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  th{text-align:left;padding:9px 10px;background:var(--navy-900);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:hover td{background:var(--paper-dim);}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
  .cell-stat{display:flex;flex-direction:column;gap:3px;}
  .bar-track{height:5px;background:var(--paper-dim);border-radius:3px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge-enrolled_through_awareness{background:var(--blue-bg);color:var(--blue);}
  .badge-already_enrolled{background:var(--green-bg);color:var(--green);}
  .badge-interested_through_awareness{background:var(--orange-bg);color:var(--orange);}
  .badge-not_interested{background:var(--red-bg);color:var(--red);}
  .badge-not_applicable{background:var(--gray-bg);color:var(--gray);}

  .search-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .search-bar input{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--paper-dim);}

  .expand-row td{background:var(--paper-dim);}
  .exp-schemes{display:flex;flex-wrap:wrap;gap:6px;}

  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--navy-900);color:#fff;padding:13px 18px;
    border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 26px rgba(0,0,0,.3);
    z-index:100;display:flex;align-items:center;gap:10px;animation:toastin .2s ease;
  }
  .toast.error{background:var(--red);}
  @keyframes toastin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .empty-state{text-align:center;padding:44px 20px;color:var(--ink-dim);}
  .empty-state .glyph{font-size:30px;margin-bottom:10px;}

  .checkbox-row{display:flex;align-items:center;gap:8px;}
  .checkbox-row input{width:16px;height:16px;}

  .confirm-overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;
    z-index:200;padding:20px;
  }
  .confirm-box{background:#fff;border-radius:14px;padding:24px;max-width:400px;width:100%;}
  .confirm-box h3{margin:0 0 10px;color:var(--navy-900);}
  .confirm-box p{font-size:13.5px;color:var(--ink-dim);line-height:1.5;margin:0 0 16px;}
  .confirm-box input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:14px;font-size:14px;}
  .confirm-actions{display:flex;gap:10px;justify-content:flex-end;}

  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1.5px solid var(--line);font-size:12.5px;font-weight:600;cursor:pointer;background:#fff;color:var(--ink-dim);}
  .chip.on{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}

  .pagination{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:14px;}

  footer.app-footer{text-align:center;padding:18px;color:var(--ink-dim);font-size:11.5px;border-top:1px solid var(--line);}
  .storage-warning{background:var(--red-bg);color:var(--red);border-bottom:1px solid #f3c6c6;padding:10px 24px;text-align:center;font-size:12.5px;font-weight:600;}

  .flex-between{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .section-gap{margin-top:26px;}
  textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;background:var(--paper-dim);}
  .fu-card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:#fff;}

  .device-note{display:flex;gap:14px;align-items:flex-start;background:var(--blue-bg);border-color:#c8dcfc;}
  .device-note-icon{font-size:20px;line-height:1;flex-shrink:0;}
  .device-note-title{font-weight:700;font-size:13.5px;color:var(--navy-900);margin-bottom:3px;}
  .device-note-body{font-size:12.5px;color:var(--ink-dim);line-height:1.55;}
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useMemo, useCallback } = React;
const h = React.createElement;

/* ---------------- Schemes (as provided) ---------------- */
const SCHEMES = [
  { id: 1, name: "Indira Gandhi National Old Age Pension Scheme (IGNOAPS)" },
  { id: 2, name: "Rashtriya Vayoshri Yojana (RVY)" },
  { id: 3, name: "Manav Kalyan Yojana" },
  { id: 4, name: "National Programme for Health Care of the Elderly (NPHCE)" },
  { id: 5, name: "SACRED Portal" },
  { id: 6, name: "Ayushman Bharat Health & Wellness Centres" },
  { id: 7, name: "Senior Citizens Savings Scheme (SCSS)" },
  { id: 8, name: "Pradhan Mantri Vaya Vandana Yojana (PMVVY)", note: "Closed for new subscriptions" },
  { id: 9, name: "Annapurna Scheme" },
  { id: 10, name: "Elderline", note: "14567 – National Helpline for Senior Citizens" },
];

const STATUS_OPTIONS = [
  { key: "enrolled_through_awareness", label: "Enrolled Through Awareness" },
  { key: "already_enrolled", label: "Already Enrolled" },
  { key: "interested_through_awareness", label: "Interested Through Awareness" },
  { key: "not_interested", label: "Not Interested" },
  { key: "not_applicable", label: "Not Applicable" },
];
const STATUS_LABEL = Object.fromEntries(STATUS_OPTIONS.map(o => [o.key, o.label]));
const STATUS_COLOR = {
  enrolled_through_awareness: "#2563eb",
  already_enrolled: "#15803d",
  interested_through_awareness: "#c2660c",
  not_interested: "#b91c1c",
  not_applicable: "#57606f",
};

/* ---------------- Storage helpers (browser localStorage) ---------------- */
/* Data is persisted in this browser's localStorage, namespaced so it never
   collides with anything else stored on the page's origin. All calls keep
   their original (key, shared) signature — "shared" is accepted but ignored,
   since localStorage is inherently local to this device/browser. */
const STORAGE_NS = "scs_v1::";
const nsKey = (key) => STORAGE_NS + key;

function isStorageAvailable() {
  try {
    const t = "__scs_test__";
    window.localStorage.setItem(t, "1");
    window.localStorage.removeItem(t);
    return true;
  } catch (e) { return false; }
}
const STORAGE_OK = isStorageAvailable();

async function storeGet(key) {
  if (!STORAGE_OK) return null;
  try { return window.localStorage.getItem(nsKey(key)); }
  catch (e) { return null; }
}
async function storeSet(key, value) {
  if (!STORAGE_OK) return false;
  try { window.localStorage.setItem(nsKey(key), value); return true; }
  catch (e) { return false; }
}
async function storeDelete(key) {
  if (!STORAGE_OK) return false;
  try { window.localStorage.removeItem(nsKey(key)); return true; }
  catch (e) { return false; }
}
async function storeListKeys(prefix) {
  if (!STORAGE_OK) return [];
  try {
    const full = nsKey(prefix);
    const keys = [];
    for (let i = 0; i < window.localStorage.length; i++) {
      const k = window.localStorage.key(i);
      if (k && k.indexOf(full) === 0) keys.push(k.slice(STORAGE_NS.length));
    }
    return keys;
  } catch (e) { return []; }
}
/* Full JSON snapshot of every record this app owns, for backup/restore
   since data no longer syncs automatically across devices. */
async function exportAllData() {
  const out = {};
  if (!STORAGE_OK) return out;
  for (let i = 0; i < window.localStorage.length; i++) {
    const k = window.localStorage.key(i);
    if (k && k.indexOf(STORAGE_NS) === 0) out[k.slice(STORAGE_NS.length)] = window.localStorage.getItem(k);
  }
  return out;
}
async function importAllData(obj) {
  if (!STORAGE_OK || !obj || typeof obj !== "object") return false;
  try {
    Object.entries(obj).forEach(([k, v]) => window.localStorage.setItem(nsKey(k), v));
    return true;
  } catch (e) { return false; }
}

function genId() {
  return "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

async function loadBeneficiaries() {
  const keys = await storeListKeys("beneficiary:", true);
  const out = [];
  for (const k of keys) {
    const v = await storeGet(k, true);
    if (v) { try { out.push(JSON.parse(v)); } catch (e) {} }
  }
  out.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  return out;
}
async function loadEnrollments() {
  const keys = await storeListKeys("enrollment:", true);
  const out = {};
  for (const k of keys) {
    const v = await storeGet(k, true);
    if (v) { try { const parsed = JSON.parse(v); out[parsed.beneficiaryId] = parsed.statuses; } catch (e) {} }
  }
  return out;
}
async function loadFollowups() {
  const keys = await storeListKeys("followup:", true);
  const out = {};
  for (const k of keys) {
    const v = await storeGet(k, true);
    if (v) { try { const parsed = JSON.parse(v); out[k] = parsed; } catch (e) {} }
  }
  return out;
}
async function loadCampaign() {
  const v = await storeGet("campaign:active", true);
  if (v) { try { return JSON.parse(v); } catch (e) {} }
  return { schemeIds: [] };
}

/* ---------------- Toast ---------------- */
function useToast() {
  const [toast, setToast] = useState(null);
  const show = useCallback((msg, type) => {
    setToast({ msg, type: type || "ok" });
    setTimeout(() => setToast(null), 2600);
  }, []);
  return [toast, show];
}

/* ---------------- App ---------------- */
function App() {
  const [page, setPage] = useState("home");
  const [beneficiaries, setBeneficiaries] = useState([]);
  const [enrollments, setEnrollments] = useState({});
  const [followups, setFollowups] = useState({});
  const [campaign, setCampaign] = useState({ schemeIds: [] });
  const [loading, setLoading] = useState(true);
  const [toast, showToast] = useToast();
  const [draftBeneficiary, setDraftBeneficiary] = useState(null);

  const refreshAll = useCallback(async () => {
    setLoading(true);
    const [b, e, f, c] = await Promise.all([loadBeneficiaries(), loadEnrollments(), loadFollowups(), loadCampaign()]);
    setBeneficiaries(b); setEnrollments(e); setFollowups(f); setCampaign(c);
    setLoading(false);
  }, []);

  useEffect(() => { refreshAll(); }, [refreshAll]);

  const nav = (p) => { setPage(p); window.scrollTo(0, 0); };

  return h("div", null,
    h(Header, { page, nav }),
    !STORAGE_OK && h("div", { className: "storage-warning" },
      "⚠ This browser is blocking local storage (often caused by private/incognito mode). Data you enter will be lost when you close this tab. Switch to normal browsing mode to save records."),
    h("main", null,
      loading ? h("div", { className: "empty-state" }, h("div", { className: "glyph" }, "⏳"), "Loading data…") :
      page === "home" ? h(Home, { nav, beneficiaries, enrollments }) :
      page === "collect" ? h(CollectData, {
        nav, showToast, refreshAll, draftBeneficiary, setDraftBeneficiary,
      }) :
      page === "analysis" ? h(Analysis, { beneficiaries, enrollments }) :
      page === "campaign" ? h(Campaign, { beneficiaries, enrollments, campaign, setCampaign, showToast }) :
      page === "followup" ? h(FollowUp, { beneficiaries, enrollments, followups, setFollowups, showToast }) :
      page === "manage" ? h(ManageData, { beneficiaries, refreshAll, showToast }) : null
    ),
    h("footer", { className: "app-footer" }, "Senior Citizen Government Schemes Platform — data is stored locally in this browser. Use Manage Data → Export Backup regularly, and Import to combine records from other devices."),
    toast && h("div", { className: "toast" + (toast.type === "error" ? " error" : "") }, toast.msg)
  );
}

function Header({ page, nav }) {
  const tabs = [
    ["home", "Home"],
    ["collect", "Collect Data"],
    ["analysis", "View Analysis"],
    ["campaign", "Awareness Campaign"],
    ["followup", "Follow-Up"],
    ["manage", "Manage Data"],
  ];
  return h("header", { className: "app-header" },
    h("div", { className: "app-header-inner" },
      h("div", { className: "brand", style: { cursor: "pointer" }, onClick: () => nav("home") },
        h("div", { className: "brand-badge" }, "SC"),
        h("div", null,

/* ---------------- Collect Data ---------------- */
function CollectData({ nav, showToast, refreshAll, draftBeneficiary, setDraftBeneficiary }) {
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({ name: "", mobile: "", age: "", location: "", gender: "", address: "" });
  const [errors, setErrors] = useState({});
  const [statuses, setStatuses] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(false);

  const validateStep1 = () => {
    const e = {};
    if (!form.name.trim()) e.name = "Full name is required.";
    if (!/^\d{10}$/.test(form.mobile.trim())) e.mobile = "Enter exactly 10 digits.";
    const ageNum = Number(form.age);
    if (!form.age || isNaN(ageNum) || ageNum < 50) e.age = "Age must be 50 or above.";
    if (!form.location.trim()) e.location = "Location / Village / Ward is required.";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const goNext = () => { if (validateStep1()) setStep(2); };

  const setStatus = (schemeId, statusKey) => setStatuses(s => ({ ...s, [schemeId]: statusKey }));

  const allSchemesAnswered = SCHEMES.every(s => statuses[s.id]);

  const submitAll = async () => {
    if (!allSchemesAnswered) { showToast("Please select a status for every scheme.", "error"); return; }
    setSubmitting(true);
    const id = genId();
    const beneficiary = { id, name: form.name.trim(), mobile: form.mobile.trim(), age: Number(form.age), location: form.location.trim(), gender: form.gender, address: form.address.trim(), createdAt: new Date().toISOString() };
    await storeSet("beneficiary:" + id, JSON.stringify(beneficiary), true);
    await storeSet("enrollment:" + id, JSON.stringify({ beneficiaryId: id, statuses }), true);
    // create follow-up entries for anyone marked interested_through_awareness
    for (const s of SCHEMES) {
      if (statuses[s.id] === "interested_through_awareness") {
        const fk = "followup:" + id + ":" + s.id;
        await storeSet(fk, JSON.stringify({ beneficiaryId: id, schemeId: s.id, status: "pending", notes: "", updatedAt: new Date().toISOString() }), true);
      }
    }
    setSubmitting(false);
    setDone(true);
    await refreshAll();
  };

  const resetForm = () => {
    setForm({ name: "", mobile: "", age: "", location: "", gender: "", address: "" });
    setStatuses({});
    setErrors({});
    setStep(1);
    setDone(false);
  };

  if (done) {
    return h("div", { className: "panel", style: { textAlign: "center", padding: "40px 24px" } },
      h("div", { style: { fontSize: 34, marginBottom: 10 } }, "✅"),
      h("h2", { style: { color: "var(--navy-900)" } }, "Beneficiary Saved"),
      h("p", { style: { color: "var(--ink-dim)" } }, form.name + " has been recorded with their scheme enrollment status."),
      h("div", { style: { display: "flex", gap: 12, justifyContent: "center", marginTop: 18, flexWrap: "wrap" } },
        h("button", { className: "btn btn-saffron", onClick: resetForm }, "+ Add Another Beneficiary"),
        h("button", { className: "btn btn-outline", onClick: () => nav("analysis") }, "View Analytics")
      )
    );
  }

  return h("div", null,
    h("div", { className: "steps" },
      h("div", { className: "step-pill" + (step === 1 ? " active" : "") }, "1. Beneficiary Details"),
      h("div", { className: "step-arrow" }, "→"),
      h("div", { className: "step-pill" + (step === 2 ? " active" : "") }, "2. Scheme Enrollment Status")
    ),
    step === 1 && h("div", { className: "panel" },
      h("div", { className: "panel-title" }, "Beneficiary Details"),
      h("div", { className: "panel-sub" }, "Basic details of the senior citizen being registered."),
      h("div", { className: "field" }, h("label", null, "Full Name *"),
        h("input", { value: form.name, onChange: e => setForm({ ...form, name: e.target.value }), placeholder: "e.g. Ramesh Patel" }),
        errors.name && h("div", { className: "err" }, errors.name)),
      h("div", { className: "field-row" },
        h("div", { className: "field" }, h("label", null, "Mobile Number *"),
          h("input", { value: form.mobile, maxLength: 10, onChange: e => setForm({ ...form, mobile: e.target.value.replace(/\D/g, "") }), placeholder: "10-digit number" }),
          errors.mobile && h("div", { className: "err" }, errors.mobile)),
        h("div", { className: "field" }, h("label", null, "Age *"),
          h("input", { type: "number", min: 50, value: form.age, onChange: e => setForm({ ...form, age: e.target.value }), placeholder: "Minimum 50" }),
          errors.age && h("div", { className: "err" }, errors.age))
      ),
      h("div", { className: "field" }, h("label", null, "Location / Village / Ward *"),
        h("input", { value: form.location, onChange: e => setForm({ ...form, location: e.target.value }), placeholder: "e.g. Ward 4, Kapadvanj" }),
        errors.location && h("div", { className: "err" }, errors.location)),
      h("div", { className: "field-row" },
        h("div", { className: "field" }, h("label", null, "Gender"),
          h("select", { value: form.gender, onChange: e => setForm({ ...form, gender: e.target.value }) },
            h("option", { value: "" }, "Select"),
            h("option", { value: "Male" }, "Male"),
            h("option", { value: "Female" }, "Female"),
            h("option", { value: "Other" }, "Other"))),
        h("div", { className: "field" }, h("label", null, "Address"),
          h("input", { value: form.address, onChange: e => setForm({ ...form, address: e.target.value }), placeholder: "Optional full address" }))
      ),
      h("div", { style: { textAlign: "right" } }, h("button", { className: "btn btn-primary", onClick: goNext }, "Next: Scheme Enrollment →"))
    ),
    step === 2 && h("div", null,
      h("div", { className: "panel" },
        h("div", { className: "flex-between" },
          h("div", null,
            h("div", { className: "panel-title" }, "Scheme Enrollment Status"),
            h("div", { className: "panel-sub" }, "Select one status for each of the " + SCHEMES.length + " schemes below.")
          ),
          h("div", { className: "mono", style: { fontSize: 12.5, color: "var(--ink-dim)" } },
            Object.keys(statuses).length + " / " + SCHEMES.length + " answered")
        ),
        SCHEMES.map(s => h("div", { key: s.id, className: "scheme-row" },
          h("div", { className: "scheme-row-head" },
            h("div", { className: "scheme-idx" }, s.id),
            h("div", null,
              h("div", { className: "scheme-name" }, s.name),
              s.note && h("div", { className: "scheme-note" }, "(" + s.note + ")")
            )
          ),
          h("div", { className: "option-grid" },
            STATUS_OPTIONS.map(opt => h("button", {
              key: opt.key,
              className: "opt-btn sel-" + opt.key + (statuses[s.id] === opt.key ? " selected" : ""),
              onClick: () => setStatus(s.id, opt.key)
            }, opt.label))
          )
        )),
        h("div", { className: "flex-between", style: { marginTop: 10 } },
          h("button", { className: "btn btn-outline", onClick: () => setStep(1) }, "← Back"),
          h("button", { className: "btn btn-saffron", disabled: submitting || !allSchemesAnswered, onClick: submitAll },
            submitting ? "Saving…" : "Submit Beneficiary Record")
        )
      )
    )
  );
}

/* ---------------- Analysis ---------------- */
const AGE_GROUPS = [
  { key: "50-60", label: "50–60", test: a => a >= 50 && a <= 60 },
  { key: "61-70", label: "61–70", test: a => a >= 61 && a <= 70 },
  { key: "71-80", label: "71–80", test: a => a >= 71 && a <= 80 },
  { key: "81+", label: "81+", test: a => a >= 81 },
];

function Analysis({ beneficiaries, enrollments, followups }) {
  const [search, setSearch] = useState("");
  const [expanded, setExpanded] = useState({});
  const [pageIdx, setPageIdx] = useState(0);
  const [locationFilter, setLocationFilter] = useState("all");
  const [genderFilter, setGenderFilter] = useState("all");
  const [ageGroupFilter, setAgeGroupFilter] = useState("all");
  const [schemeFocus, setSchemeFocus] = useState(null);
  const [detailId, setDetailId] = useState(null);
  const PAGE_SIZE = 8;

  const locations = useMemo(() => Array.from(new Set(beneficiaries.map(b => b.location).filter(Boolean))).sort(), [beneficiaries]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return beneficiaries.filter(b => {
      if (q && !((b.name || "").toLowerCase().includes(q) || (b.mobile || "").includes(q) || (b.location || "").toLowerCase().includes(q))) return false;
      if (locationFilter !== "all" && b.location !== locationFilter) return false;
      if (genderFilter !== "all" && (b.gender || "Unspecified") !== genderFilter) return false;
      if (ageGroupFilter !== "all") {
        const grp = AGE_GROUPS.find(g => g.key === ageGroupFilter);
        if (!grp || !grp.test(Number(b.age))) return false;
      }
      if (schemeFocus && !(enrollments[b.id] && enrollments[b.id][schemeFocus])) return false;
      return true;
    });
  }, [beneficiaries, search, locationFilter, genderFilter, ageGroupFilter, schemeFocus, enrollments]);

  const filteredEnrollments = useMemo(() => {
    const ids = new Set(filtered.map(b => b.id));
    const out = {};
    Object.entries(enrollments).forEach(([id, st]) => { if (ids.has(id)) out[id] = st; });
    return out;
  }, [filtered, enrollments]);

  const overallCounts = useMemo(() => {
    const c = { enrolled_through_awareness: 0, already_enrolled: 0, interested_through_awareness: 0, not_interested: 0, not_applicable: 0 };
    Object.values(filteredEnrollments).forEach(st => Object.values(st || {}).forEach(v => { if (c[v] !== undefined) c[v]++; }));
    return c;
  }, [filteredEnrollments]);

  const schemeStats = useMemo(() => {
    return SCHEMES.map(s => {
      const c = { enrolled_through_awareness: 0, already_enrolled: 0, interested_through_awareness: 0, not_interested: 0, not_applicable: 0 };
      Object.values(filteredEnrollments).forEach(st => { const v = st && st[s.id]; if (v && c[v] !== undefined) c[v]++; });
      const total = Object.values(c).reduce((a, b) => a + b, 0);
      return { scheme: s, counts: c, total };
    });
  }, [filteredEnrollments]);

  const genderStats = useMemo(() => {
    const c = {};
    filtered.forEach(b => { const g = b.gender || "Unspecified"; c[g] = (c[g] || 0) + 1; });
    return Object.entries(c).sort((a, b) => b[1] - a[1]);
  }, [filtered]);

  const ageStats = useMemo(() => AGE_GROUPS.map(g => ({ label: g.label, count: filtered.filter(b => g.test(Number(b.age))).length })), [filtered]);

  const locationStats = useMemo(() => {
    const map = {};
    filtered.forEach(b => {
      const loc = b.location || "Unspecified";
      if (!map[loc]) map[loc] = { location: loc, total: 0, enrolled: 0, interested: 0 };
      map[loc].total++;
      const st = enrollments[b.id] || {};
      Object.values(st).forEach(v => {
        if (v === "enrolled_through_awareness" || v === "already_enrolled") map[loc].enrolled++;
        if (v === "interested_through_awareness") map[loc].interested++;
      });
    });
    return Object.values(map).sort((a, b) => b.total - a.total);
  }, [filtered, enrollments]);

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pageRows = filtered.slice(pageIdx * PAGE_SIZE, pageIdx * PAGE_SIZE + PAGE_SIZE);
  const activeFilterCount = [locationFilter !== "all", genderFilter !== "all", ageGroupFilter !== "all", !!schemeFocus, !!search.trim()].filter(Boolean).length;
  const clearFilters = () => { setSearch(""); setLocationFilter("all"); setGenderFilter("all"); setAgeGroupFilter("all"); setSchemeFocus(null); setPageIdx(0); };

  const downloadCSV = () => {
    const headers = ["Name", "Mobile Number", "Age", "Location", "Gender", "Date Added", ...SCHEMES.map(s => s.name)];
    const rows = filtered.map(b => {
      const st = enrollments[b.id] || {};
      const schemeCols = SCHEMES.map(s => STATUS_LABEL[st[s.id]] || "Not Recorded");
      return [b.name, b.mobile, b.age, b.location, b.gender || "", new Date(b.createdAt).toLocaleDateString(), ...schemeCols];
    });
    const csv = [headers, ...rows].map(r => r.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().slice(0, 10);
    a.href = url; a.download = "senior-schemes-data-" + date + (activeFilterCount ? "-filtered" : "") + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const maxSchemeTotal = Math.max(1, ...schemeStats.map(s => s.total));
  const detailBeneficiary = detailId ? beneficiaries.find(b => b.id === detailId) : null;

  return h("div", null,
    h("div", { className: "panel filter-panel" },
      h("div", { className: "flex-between" },
        h("div", null, h("div", { className: "panel-title" }, "Filters"), h("div", { className: "panel-sub" }, "Narrow everything below by demographics, location, or a specific scheme.")),
        activeFilterCount > 0 && h("button", { className: "btn btn-outline btn-sm", onClick: clearFilters }, "Clear all filters (" + activeFilterCount + ")")
      ),
      h("div", { className: "filter-grid" },
        h("div", { className: "field" }, h("label", null, "Search"),
          h("input", { placeholder: "Name, mobile, or location…", value: search, onChange: e => { setSearch(e.target.value); setPageIdx(0); } })),
        h("div", { className: "field" }, h("label", null, "Location"),
          h("select", { value: locationFilter, onChange: e => { setLocationFilter(e.target.value); setPageIdx(0); } },
            h("option", { value: "all" }, "All locations"),
            locations.map(loc => h("option", { key: loc, value: loc }, loc)))),
        h("div", { className: "field" }, h("label", null, "Gender"),
          h("select", { value: genderFilter, onChange: e => { setGenderFilter(e.target.value); setPageIdx(0); } },
            h("option", { value: "all" }, "All genders"),
            ["Male", "Female", "Other", "Unspecified"].map(g => h("option", { key: g, value: g }, g)))),
        h("div", { className: "field" }, h("label", null, "Age group"),
          h("select", { value: ageGroupFilter, onChange: e => { setAgeGroupFilter(e.target.value); setPageIdx(0); } },
            h("option", { value: "all" }, "All ages"),
            AGE_GROUPS.map(g => h("option", { key: g.key, value: g.key }, g.label))))
      ),
      schemeFocus && h("div", { className: "focus-chip" },
        "Focused on scheme: ", h("strong", null, SCHEMES.find(s => s.id === schemeFocus).name),
        h("button", { className: "focus-chip-x", onClick: () => setSchemeFocus(null) }, "✕"))
    ),

    h("div", { className: "summary-grid" },
      h("div", { className: "summary-card sc-total" }, h("div", { className: "num" }, filtered.length), h("div", { className: "lbl" }, "Beneficiaries" + (activeFilterCount ? " (Filtered)" : ""))),
      STATUS_OPTIONS.map(opt => h("div", { key: opt.key, className: "summary-card sc-" + opt.key },
        h("div", { className: "num" }, overallCounts[opt.key]), h("div", { className: "lbl" }, opt.label)))
    ),

    h("div", { className: "panel" },
      h("div", { className: "panel-title" }, "Scheme-Wise Breakdown"),
      h("div", { className: "panel-sub" }, "Count and percentage of each status, per scheme. Click a row to focus the records table below on just that scheme."),
      h("div", { className: "table-wrap" },
        h("table", null,
          h("thead", null, h("tr", null,
            h("th", null, "Scheme"),
            STATUS_OPTIONS.map(o => h("th", { key: o.key }, o.label)),
            h("th", null, "Total")
          )),
          h("tbody", null,
            schemeStats.map(row => h("tr", {
              key: row.scheme.id,
              className: "scheme-stat-row" + (schemeFocus === row.scheme.id ? " focused" : ""),
              onClick: () => { setSchemeFocus(schemeFocus === row.scheme.id ? null : row.scheme.id); setPageIdx(0); }
            },
              h("td", null, h("strong", null, row.scheme.id + ". " + row.scheme.name)),
              STATUS_OPTIONS.map(o => {
                const cnt = row.counts[o.key];
                const pct = row.total ? Math.round((cnt / row.total) * 100) : 0;
                return h("td", { key: o.key },
                  h("div", { className: "cell-stat" },
                    h("span", null, cnt + " (" + pct + "%)"),
                    h("div", { className: "bar-track" }, h("div", { className: "bar-fill", style: { width: pct + "%", background: STATUS_COLOR[o.key] } }))
                  ));
              }),
              h("td", null, h("strong", null, row.total))
            ))
          )
        )
      )
    ),

    h("div", { className: "panel" },
      h("div", { className: "panel-title" }, "Charts"),
      h("div", { style: { display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 24, alignItems: "start" }, className: "chart-grid" },
        h(BarChart, { data: schemeStats, max: maxSchemeTotal }),
        h(PieChart, { counts: overallCounts })
      )
    ),

    h("div", { className: "panel" },
      h("div", { className: "panel-title" }, "Demographics"),
      h("div", { className: "panel-sub" }, "Who's been reached so far, broken down by gender, age, and location."),
      h("div", { className: "demo-grid" },
        h("div", null,
          h("div", { className: "demo-heading" }, "By Gender"),
          genderStats.length === 0 ? h("div", { className: "empty-mini" }, "No data yet.") :
          genderStats.map(([g, n]) => h("div", { key: g, className: "demo-row" },
            h("span", { className: "demo-label" }, g),
            h("div", { className: "demo-bar-track" }, h("div", { className: "demo-bar-fill", style: { width: (filtered.length ? (n / filtered.length) * 100 : 0) + "%" } })),
            h("span", { className: "demo-count" }, n)
          ))
        ),
        h("div", null,
          h("div", { className: "demo-heading" }, "By Age Group"),
          ageStats.every(a => a.count === 0) ? h("div", { className: "empty-mini" }, "No data yet.") :
          ageStats.map(a => h("div", { key: a.label, className: "demo-row" },
            h("span", { className: "demo-label" }, a.label),
            h("div", { className: "demo-bar-track" }, h("div", { className: "demo-bar-fill", style: { width: (filtered.length ? (a.count / filtered.length) * 100 : 0) + "%", background: "var(--saffron)" } })),
            h("span", { className: "demo-count" }, a.count)

                  h("div", { className: "exp-schemes" },
                    SCHEMES.map(s => {
                      const st = (enrollments[b.id] || {})[s.id];
                      return h("span", { key: s.id, className: "badge badge-" + (st || "not_applicable") },
                        s.id + ". " + s.name.split(" (")[0] + ": " + (STATUS_LABEL[st] || "Not Recorded"));
                    })
                  )
                ))

          )

        b.address && h("div", { className: "detail-meta-full" }, h("span", null, "Address: "), h("strong", null, b.address)),
        h("div", null, h("span", null, "Registered: "), h("strong", null, new Date(b.createdAt).toLocaleDateString()))
      ),

            fu && h("div", { className: "detail-followup-note" }, "Follow-up: " + (fuMeta ? fuMeta.label : fu.status) + (fu.notes ? " — " + fu.notes : ""))

    )

function BarChart({ data, max }) {
  const w = 560, barH = 20, gap = 14, leftPad = 210, chartW = w - leftPad - 20;
  const h_ = data.length * (barH + gap) + 20;
  return h("div", null,
    h("div", { style: { fontSize: 12.5, fontWeight: 700, color: "var(--navy-900)", marginBottom: 10 } }, "Enrolled + Interested (via Awareness) per Scheme"),
    h("svg", { viewBox: "0 0 " + w + " " + h_, style: { width: "100%", height: "auto" } },
      data.map((row, i) => {
        const y = i * (barH + gap) + 10;
        const val = row.counts.enrolled_through_awareness + row.counts.interested_through_awareness;
        const bw = max ? (val / max) * chartW : 0;
        return h("g", { key: row.scheme.id },
          h("text", { x: leftPad - 8, y: y + barH * 0.72, textAnchor: "end", fontSize: "10.5", fill: "#5b6270" }, row.scheme.id + ". " + row.scheme.name.split(" (")[0].slice(0, 26)),
          h("rect", { x: leftPad, y, width: chartW, height: barH, fill: "#f0ede5", rx: 4 }),
          h("rect", { x: leftPad, y, width: bw, height: barH, fill: "#2563eb", rx: 4 }),
          h("text", { x: leftPad + bw + 6, y: y + barH * 0.72, fontSize: "10.5", fill: "#1c1e21", fontWeight: 700 }, val)
        );
      })
    )
  );
}

function PieChart({ counts }) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const cx = 100, cy = 100, r = 90;
  let angle = -90;
  const slices = STATUS_OPTIONS.map(opt => {
    const val = counts[opt.key];
    const frac = total ? val / total : 0;
    const start = angle;
    const sweep = frac * 360;
    angle += sweep;
    const end = angle;
    const large = sweep > 180 ? 1 : 0;
    const toXY = (deg) => {
      const rad = (deg * Math.PI) / 180;
      return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
    };
    const [x1, y1] = toXY(start);
    const [x2, y2] = toXY(end);
    const d = total === 0 ? "" : `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
    return { d, color: STATUS_COLOR[opt.key], label: opt.label, val, pct: total ? Math.round(frac * 100) : 0 };
  });
  return h("div", null,
    h("div", { style: { fontSize: 12.5, fontWeight: 700, color: "var(--navy-900)", marginBottom: 10 } }, "Overall Status Distribution"),
    h("svg", { viewBox: "0 0 200 200", style: { width: "100%", maxWidth: 220, height: "auto", display: "block", margin: "0 auto" } },
      total === 0 ? h("circle", { cx: 100, cy: 100, r: 90, fill: "#eceef1" }) : slices.map((s, i) => h("path", { key: i, d: s.d, fill: s.color }))
    ),
    h("div", { style: { display: "flex", flexDirection: "column", gap: 6, marginTop: 12 } },
      slices.map((s, i) => h("div", { key: i, style: { display: "flex", alignItems: "center", gap: 8, fontSize: 12 } },
        h("span", { style: { width: 10, height: 10, borderRadius: 3, background: s.color, display: "inline-block", flexShrink: 0 } }),
        h("span", { style: { color: "var(--ink-dim)" } }, s.label + ": "),
        h("strong", null, s.val + " (" + s.pct + "%)")
      ))
    )
  );
}

/* ---------------- Awareness Campaign ---------------- */
function Campaign({ beneficiaries, enrollments, campaign, setCampaign, showToast }) {
  const toggleScheme = async (id) => {
    const ids = campaign.schemeIds.includes(id) ? campaign.schemeIds.filter(x => x !== id) : [...campaign.schemeIds, id];
    const next = { schemeIds: ids, updatedAt: new Date().toISOString() };
    setCampaign(next);
    await storeSet("campaign:active", JSON.stringify(next), true);
    showToast("Awareness campaign updated.");
  };

  const activeSchemes = SCHEMES.filter(s => campaign.schemeIds.includes(s.id));

  const statsForScheme = (schemeId) => {
    const c = { enrolled_through_awareness: 0, already_enrolled: 0, interested_through_awareness: 0, not_interested: 0, not_applicable: 0 };
    const people = [];
    Object.entries(enrollments).forEach(([bid, st]) => {
      const v = st && st[schemeId];
      if (v && c[v] !== undefined) { c[v]++; if (v === "enrolled_through_awareness" || v === "interested_through_awareness") people.push(bid); }
    });
    return { c, people };
  };

  const beneficiaryById = useMemo(() => Object.fromEntries(beneficiaries.map(b => [b.id, b])), [beneficiaries]);

  return h("div", null,
    h("div", { className: "panel" },
      h("div", { className: "panel-title" }, "Awareness Campaign"),
      h("div", { className: "panel-sub" }, "Select the scheme(s) you're currently running an awareness drive for. This keeps a focused view of that campaign's data — separate from the full analytics."),
      h("div", { style: { display: "flex", flexWrap: "wrap", gap: 8 } },
        SCHEMES.map(s => h("button", {
          key: s.id, className: "chip" + (campaign.schemeIds.includes(s.id) ? " on" : ""), onClick: () => toggleScheme(s.id)
        }, (campaign.schemeIds.includes(s.id) ? "✓ " : "") + s.id + ". " + s.name.split(" (")[0]))
      )
    ),

    activeSchemes.length === 0 ? h("div", { className: "panel empty-state" }, h("div", { className: "glyph" }, "📣"), "No scheme selected yet. Choose one or more schemes above to start tracking an awareness campaign.") :
    activeSchemes.map(s => {
      const { c, people } = statsForScheme(s.id);
      const total = Object.values(c).reduce((a, b) => a + b, 0);
      return h("div", { key: s.id, className: "panel" },
        h("div", { className: "panel-title" }, s.id + ". " + s.name),
        s.note && h("div", { className: "panel-sub" }, "(" + s.note + ")"),
        h("div", { className: "summary-grid" },
          STATUS_OPTIONS.map(opt => h("div", { key: opt.key, className: "summary-card sc-" + opt.key },
            h("div", { className: "num" }, c[opt.key]), h("div", { className: "lbl" }, opt.label)))
        ),
        h("div", { className: "panel-sub" }, total + " total responses recorded for this scheme so far."),
        people.length > 0 && h("div", { className: "section-gap" },
          h("div", { style: { fontSize: 12.5, fontWeight: 700, color: "var(--navy-900)", marginBottom: 8 } }, "Reached through awareness (" + people.length + ")"),
          h("div", { className: "table-wrap" },
            h("table", null,
              h("thead", null, h("tr", null, h("th", null, "Name"), h("th", null, "Mobile"), h("th", null, "Location"), h("th", null, "Status"))),
              h("tbody", null,
                people.map(bid => {
                  const b = beneficiaryById[bid]; if (!b) return null;
                  const st = enrollments[bid][s.id];
                  return h("tr", { key: bid },
                    h("td", null, b.name), h("td", { className: "mono" }, b.mobile), h("td", null, b.location),
                    h("td", null, h("span", { className: "badge badge-" + st }, STATUS_LABEL[st])));
                })
              )
            )
          )
        )
      );
    })
  );
}

/* ---------------- Follow-Up ---------------- */
const FU_STATUS = [
  { key: "pending", label: "Pending", color: "#c2660c" },
  { key: "contacted", label: "Contacted", color: "#2563eb" },
  { key: "converted", label: "Converted / Enrolled", color: "#15803d" },
  { key: "not_needed", label: "No Longer Needed", color: "#57606f" },
];

function FollowUp({ beneficiaries, enrollments, followups, setFollowups, showToast }) {
  const [filter, setFilter] = useState("pending");
  const beneficiaryById = useMemo(() => Object.fromEntries(beneficiaries.map(b => [b.id, b])), [beneficiaries]);

  const list = useMemo(() => {
    const items = [];
    Object.entries(enrollments).forEach(([bid, st]) => {
      SCHEMES.forEach(s => {
        if (st && st[s.id] === "interested_through_awareness") {
          const fk = "followup:" + bid + ":" + s.id;
          const fu = followups[fk] || { beneficiaryId: bid, schemeId: s.id, status: "pending", notes: "" };
          items.push({ key: fk, beneficiary: beneficiaryById[bid], scheme: s, fu });
        }
      });
    });
    return items.filter(it => it.beneficiary);
  }, [enrollments, followups, beneficiaryById]);

  const filtered = filter === "all" ? list : list.filter(it => it.fu.status === filter);

  const updateFollowup = async (key, patch) => {
    const existing = followups[key] || {};
    const next = { ...existing, ...patch, updatedAt: new Date().toISOString() };
    setFollowups(f => ({ ...f, [key]: next }));
    await storeSet(key, JSON.stringify(next), true);
  };

  const counts = useMemo(() => {
    const c = { pending: 0, contacted: 0, converted: 0, not_needed: 0 };
    list.forEach(it => { c[it.fu.status] = (c[it.fu.status] || 0) + 1; });
    return c;
  }, [list]);

  return h("div", null,
    h("div", { className: "summary-grid" },
      h("div", { className: "summary-card sc-total" }, h("div", { className: "num" }, list.length), h("div", { className: "lbl" }, "Total Interested (via Awareness)")),
      FU_STATUS.map(fs => h("div", { key: fs.key, className: "summary-card" },
        h("div", { className: "num", style: { color: fs.color } }, counts[fs.key] || 0), h("div", { className: "lbl" }, fs.label)))
    ),
    h("div", { className: "panel" },
      h("div", { className: "flex-between" },
        h("div", null, h("div", { className: "panel-title" }, "Follow-Up Queue"), h("div", { className: "panel-sub" }, "Beneficiaries who showed interest through the awareness campaign and haven't been formally enrolled yet.")),
        h("div", { style: { display: "flex", gap: 6, flexWrap: "wrap" } },
          ["all", ...FU_STATUS.map(f => f.key)].map(k => h("button", {
            key: k, className: "chip" + (filter === k ? " on" : ""), onClick: () => setFilter(k)
          }, k === "all" ? "All" : FU_STATUS.find(f => f.key === k).label))
        )
      ),
      filtered.length === 0 ? h("div", { className: "empty-state" }, h("div", { className: "glyph" }, "📞"), "No follow-ups in this filter.") :
      filtered.map(it => h("div", { key: it.key, className: "fu-card" },
        h("div", { className: "flex-between" },
          h("div", null,
            h("strong", null, it.beneficiary.name), " · ", h("span", { className: "mono" }, it.beneficiary.mobile), " · ", it.beneficiary.location,
            h("div", { style: { fontSize: 12.5, color: "var(--ink-dim)", marginTop: 3 } }, "Scheme: " + it.scheme.id + ". " + it.scheme.name)
          ),
          h("div", { style: { display: "flex", gap: 6, flexWrap: "wrap" } },
            FU_STATUS.map(fs => h("button", {
              key: fs.key,
              className: "btn btn-sm " + (it.fu.status === fs.key ? "btn-primary" : "btn-outline"),
              onClick: () => updateFollowup(it.key, { status: fs.key })
            }, fs.label))
          )
        ),
        h("div", { style: { marginTop: 10 } },
          h("textarea", {
            rows: 2, placeholder: "Follow-up notes (e.g. visit date, what was discussed)…",
            defaultValue: it.fu.notes || "",
            onBlur: (e) => { if (e.target.value !== it.fu.notes) { updateFollowup(it.key, { notes: e.target.value }); showToast("Note saved."); } }
          })
        )
      ))
    )
  );
}

/* ---------------- Manage Data ---------------- */
function ManageData({ beneficiaries, refreshAll, showToast }) {
  const [selected, setSelected] = useState({});
  const [confirmType, setConfirmType] = useState(null); // 'selected' | 'all'
  const [confirmText, setConfirmText] = useState("");
  const [busy, setBusy] = useState(false);
  const [importBusy, setImportBusy] = useState(false);
  const fileInputRef = React.useRef(null);

  const toggle = (id) => setSelected(s => ({ ...s, [id]: !s[id] }));
  const selectedIds = Object.keys(selected).filter(id => selected[id]);

  const deleteBeneficiaryFully = async (id) => {
    await storeDelete("beneficiary:" + id, true);
    await storeDelete("enrollment:" + id, true);
    const fuKeys = await storeListKeys("followup:" + id + ":", true);
    for (const k of fuKeys) await storeDelete(k, true);
  };

  const deleteOne = async (id) => {
    setBusy(true);
    await deleteBeneficiaryFully(id);
    setBusy(false);
    await refreshAll();
    showToast("Record deleted.");
  };

  const deleteSelected = async () => {
    setBusy(true);
    for (const id of selectedIds) await deleteBeneficiaryFully(id);
    setBusy(false);
    setSelected({});
    setConfirmType(null);
    await refreshAll();
    showToast(selectedIds.length + " record(s) deleted.");
  };

  const deleteAll = async () => {
    setBusy(true);
    for (const b of beneficiaries) await deleteBeneficiaryFully(b.id);
    const campKeys = await storeListKeys("campaign:", true);
    for (const k of campKeys) await storeDelete(k, true);
    setBusy(false);
    setConfirmType(null);
    setConfirmText("");
    await refreshAll();
    showToast("All data deleted.");
  };

  const downloadCSVBeforeDelete = async () => {
    const enrollments = await loadEnrollments();
    const headers = ["Name", "Mobile Number", "Age", "Location", "Gender", "Date Added", ...SCHEMES.map(s => s.name)];
    const rows = beneficiaries.map(b => {
      const st = enrollments[b.id] || {};
      const schemeCols = SCHEMES.map(s => STATUS_LABEL[st[s.id]] || "Not Recorded");
      return [b.name, b.mobile, b.age, b.location, b.gender || "", new Date(b.createdAt).toLocaleDateString(), ...schemeCols];
    });
    const csv = [headers, ...rows].map(r => r.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "senior-schemes-backup-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const downloadJSONBackup = async () => {
    const data = await exportAllData();
    const blob = new Blob([JSON.stringify({ app: "senior-citizen-schemes", exportedAt: new Date().toISOString(), data }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "senior-schemes-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Full backup (JSON) downloaded.");
  };

  const handleImportFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImportBusy(true);
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const payload = parsed && parsed.data ? parsed.data : parsed;
      const ok = await importAllData(payload);
      if (ok) { await refreshAll(); showToast("Backup imported and merged into this browser's data."); }
      else showToast("Import failed — file could not be saved to storage.", "error");
    } catch (err) {
      showToast("Import failed — that doesn't look like a valid backup file.", "error");
    }
    setImportBusy(false);
    if (fileInputRef.current) fileInputRef.current.value = "";
  };

  return h("div", null,
    h("div", { className: "panel device-note" },
      h("div", { className: "device-note-icon" }, "💾"),
      h("div", null,
        h("div", { className: "device-note-title" }, "Data lives in this browser"),
        h("div", { className: "device-note-body" }, "Records are saved to this device's local storage only — they will not appear on another phone, computer, or browser automatically. Export a JSON backup after fieldwork and Import it on the device you use for reporting to combine everyone's data.")
      )
    ),
    h("div", { className: "panel", style: { display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 14 } },
      h("div", null,
        h("div", { className: "panel-sub" }, "Total records on this device"),
        h("div", { style: { fontSize: 30, fontWeight: 800, color: "var(--navy-900)" } }, beneficiaries.length)
      ),
      h("div", { style: { display: "flex", gap: 10, flexWrap: "wrap" } },
        h("button", { className: "btn btn-outline", onClick: downloadJSONBackup, disabled: beneficiaries.length === 0 }, "⬇ Export Full Backup (JSON)"),
        h("button", { className: "btn btn-outline", onClick: downloadCSVBeforeDelete, disabled: beneficiaries.length === 0 }, "⬇ Export Backup CSV"),
        h("input", { ref: fileInputRef, type: "file", accept: "application/json", style: { display: "none" }, onChange: handleImportFile }),
        h("button", { className: "btn btn-outline", disabled: importBusy, onClick: () => fileInputRef.current && fileInputRef.current.click() }, importBusy ? "Importing…" : "⬆ Import Backup (JSON)"),
        h("button", { className: "btn btn-outline", disabled: selectedIds.length === 0, onClick: () => setConfirmType("selected") }, "Delete Selected (" + selectedIds.length + ")"),
        h("button", { className: "btn btn-danger", disabled: beneficiaries.length === 0, onClick: () => setConfirmType("all") }, "Delete All Data")
      )
    ),

    h("div", { className: "panel" },
      h("div", { className: "panel-title" }, "All Records"),
      h("div", { className: "panel-sub" }, "This action is irreversible. Deleted beneficiaries, their scheme statuses, and any linked follow-ups are permanently removed."),
      beneficiaries.length === 0 ? h("div", { className: "empty-state" }, h("div", { className: "glyph" }, "🗄"), "No records yet.") :
      h("div", { className: "table-wrap" },
        h("table", null,
          h("thead", null, h("tr", null, h("th", null, ""), h("th", null, "Name"), h("th", null, "Mobile"), h("th", null, "Age"), h("th", null, "Location"), h("th", null, "Date Added"), h("th", null, "Actions"))),
          h("tbody", null,
            beneficiaries.map(b => h("tr", { key: b.id },
              h("td", null, h("input", { type: "checkbox", checked: !!selected[b.id], onChange: () => toggle(b.id) })),
              h("td", null, b.name), h("td", { className: "mono" }, b.mobile), h("td", null, b.age), h("td", null, b.location),
              h("td", null, new Date(b.createdAt).toLocaleDateString()),
              h("td", null, h("button", { className: "btn btn-sm btn-outline", disabled: busy, onClick: () => deleteOne(b.id) }, "Delete"))
            ))
          )
        )
      )
    ),

    confirmType && h("div", { className: "confirm-overlay" },
      h("div", { className: "confirm-box" },
        h("h3", null, confirmType === "all" ? "Delete ALL data?" : "Delete selected records?"),
        h("p", null, confirmType === "all"
          ? "This will permanently erase every beneficiary, their scheme statuses, follow-ups, and the active campaign selection. Type DELETE below to confirm."
          : "This will permanently delete " + selectedIds.length + " record(s) and their scheme statuses. This cannot be undone."),
        confirmType === "all" && h("input", { placeholder: 'Type "DELETE" to confirm', value: confirmText, onChange: e => setConfirmText(e.target.value) }),
        h("div", { className: "confirm-actions" },
          h("button", { className: "btn btn-outline", onClick: () => { setConfirmType(null); setConfirmText(""); } }, "Cancel"),
          h("button", {
            className: "btn btn-danger",
            disabled: busy || (confirmType === "all" && confirmText.trim().toUpperCase() !== "DELETE"),
            onClick: () => confirmType === "all" ? deleteAll() : deleteSelected()
          }, busy ? "Deleting…" : "Confirm Delete")
        )
      )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(h(App));
</script>
